# Active les vraies couleurs (True Color) pour Neovim
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",*:Tc"

# Supprime le délai d'échappement (indispensable pour le mode normal de Neovim)
set -s escape-time 0

# Active la souris pour redimensionner ou scroller
set -g mouse on

# Navigation entre les panneaux façon Vim (h, j, k, l)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Découpage plus intuitif (| pour vertical, - pour horizontal)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Défilement en mode copie façon Vi
setw -g mode-keys vi

# Détection automatique de Vim / Neovim
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"

bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'

# Permet de nettoyer l'écran dans le terminal avec Ctrl+l via Préfixe + Ctrl+l
bind C-l send-keys 'C-l'
